{% extends 'base.html' %}
{% block title %}Login - Campus Help Desk{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
        <div class="bg-primary px-6 py-4">
            <h2 class="text-xl font-bold text-white text-center">Welcome Back</h2>
        </div>
        <div class="p-8">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
                        {{ field.errors }}
                        <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition {% if field.errors %}border-red-500{% endif %}" {% if field.field.required %}required{% endif %}>
                    </div>
                {% endfor %}
                <button type="submit" class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-primaryDark transition duration-200 shadow-md">Sign In</button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-600">
                Need a student account? <a href="{% url 'accounts:register' %}" class="text-primary font-semibold hover:underline">Register here</a>.
            </div>
        </div>
    </div>
</div>
{% endblock %}
